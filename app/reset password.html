<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Virtual Herbal Garden</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background: url('https://images.pexels.com/photos/1558663/pexels-photo-1558663.jpeg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .forgot-container {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
            color: #fff;
            backdrop-filter: blur(5px);
        }
        
        .forgot-container h2 {
            margin-bottom: 25px;
            font-size: 28px;
            color: #c8e6c9;
        }
        
        .forgot-container input[type="email"] {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .forgot-container input[type="submit"] {
            width: 95%;
            padding: 12px;
            margin-top: 15px;
            background-color: #2e7d32;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .forgot-container input[type="submit"]:hover {
            background-color: #1b5e20;
        }
        
        .forgot-container a {
            display: block;
            margin-top: 15px;
            color: #a5d6a7;
            text-decoration: none;
            font-size: 14px;
        }
        
        .forgot-container a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 450px) {
            .forgot-container {
                padding: 30px 20px;
            }
            .forgot-container h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="forgot-container">
        <h2>🔑 Forgot Password</h2>
        <form action="login page.html" method="POST">
            <input type="email" name="email" placeholder="Enter your registered email" required><br>
            <input type="submit" value="Reset Password">
        </form>
        <a href="login page.html">Back to Login</a>
    </div>

</body>

</html>
